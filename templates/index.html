<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board Game Finder</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="container">
        <h1>🎲 Board Game Finder</h1>

        <div class="filters">
            <label>
                Players:
                <input type="number" id="playersInput" placeholder="e.g. 4">
            </label>

            <label>
                Max Playtime (mins):
                <input type="number" id="playtimeInput" placeholder="e.g. 30">
            </label>

            <button onclick="loadGames()">Search</button>
            <button onclick="clearFilters()">Clear</button>
        </div>

        <table id="gamesTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Players</th>
                    <th>Playtime</th>
                </tr>
            </thead>
            <tbody id="gamesBody">
                <!-- Games will load here -->
            </tbody>
        </table>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
