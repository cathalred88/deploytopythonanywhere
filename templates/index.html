<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board Game Database</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">
    <h1>🎲 Board Game Database</h1>

    <section class="form-section">
        <h2 id="formTitle">Add New Board Game</h2>

        <input type="hidden" id="gameId">

        <div class="form-grid">
            <input type="text" id="name" placeholder="Game name">
            <input type="number" id="year_published" placeholder="Year published">
            <input type="number" id="min_players" placeholder="Min players">
            <input type="number" id="max_players" placeholder="Max players">
            <input type="number" id="playtime" placeholder="Playtime mins">
        </div>

        <div class="button-row">
            <button onclick="saveGame()">Save Game</button>
            <button onclick="clearForm()" class="secondary">Clear</button>
        </div>
    </section>

    <section class="filter-section">
        <h2>Filter Games</h2>

        <input type="number" id="playersInput" placeholder="Players e.g. 4">
        <input type="number" id="playtimeInput" placeholder="Max playtime e.g. 30">

        <button onclick="loadGames()">Apply Filters</button>
        <button onclick="clearFilters()" class="secondary">Clear Filters</button>
    </section>

    <table>
        <thead>
            <tr>
                <th onclick="sortTable('id')">ID ⬍</th>
                <th onclick="sortTable('name')">Name ⬍</th>
                <th onclick="sortTable('year_published')">Year ⬍</th>
                <th onclick="sortTable('min_players')">Min Players ⬍</th>
                <th onclick="sortTable('max_players')">Max Players ⬍</th>
                <th onclick="sortTable('playtime')">Playtime ⬍</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
    </table>
</div>

<script src="/static/app.js"></script>
</body>
</html>
